<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Gence Saha Raporu</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#F7F8FA;
  --surface:#FFFFFF;
  --surface-2:#FBFBFD;
  --ink:#1C2330;
  --ink-2:#6E7889;
  --ink-3:#98A1AF;
  --line:#E7EAF0;
  --line-2:#F0F2F6;
  --accent:#3E5C8A;
  --accent-soft:#EDF2F9;
  --mark:#A8793A;
  --mark-soft:#FAF3E9;
  --danger:#A3433B;
  --r:10px;
  --shadow:0 1px 2px rgba(28,35,48,.05);
  --shadow-2:0 4px 16px rgba(28,35,48,.10);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:400 16px/1.5 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;
  padding-bottom:104px;-webkit-font-smoothing:antialiased}
input,textarea,button{font:inherit;color:inherit}
textarea{resize:none}
button{cursor:pointer;transition:background .15s var(--ease),border-color .15s var(--ease),
  color .15s var(--ease),transform .12s var(--ease),opacity .15s var(--ease)}
button:active{transform:scale(.97)}

/* ---------- üst bar ---------- */
header.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
header.top h1{font-size:16px;font-weight:600;margin:0;flex:1;min-width:0;letter-spacing:-.01em}
header.top h1 small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);
  margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:opacity .2s var(--ease)}
.iconbtn{background:transparent;border:0;color:var(--ink-2);border-radius:8px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;padding:0;flex:none}
.iconbtn:hover{background:var(--line-2)}

main{padding:16px 14px 0;max-width:700px;margin:0 auto}
.hide{display:none !important}

/* ---------- kart ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.card > .card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 14px 0;font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3)}
.card-b{padding:12px 14px 14px}
label.f{display:block;margin-bottom:14px}
label.f:last-child{margin-bottom:0}
label.f > span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
label.f input,label.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface-2);
  transition:border-color .15s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease)}
label.f input::placeholder,label.f textarea::placeholder,.item textarea::placeholder{color:var(--ink-3)}
label.f input:focus,label.f textarea:focus{outline:0;background:var(--surface);
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item textarea:focus{outline:0;background:var(--surface-2)}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.titleprev{margin-top:2px;padding:12px 14px;background:var(--accent-soft);
  border-radius:8px;font-family:"Times New Roman",Georgia,serif;font-weight:700;
  font-size:15px;line-height:1.4;word-break:break-word;color:#27374F}

/* ---------- segment seçici ---------- */
.seg{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:9px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink-2);font-size:14px;
  padding:9px 4px;border-radius:6px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:var(--shadow)}

/* ---------- rapor listesi ---------- */
.rap{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;
  padding:14px;box-shadow:var(--shadow);animation:girisAlt .32s var(--ease) both}
.rap .t{flex:1;min-width:0}
.rap .t b{display:block;font-size:15px;font-weight:600;line-height:1.35;
  word-break:break-word;letter-spacing:-.01em}
.rap .t i{display:block;font-style:normal;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.empty{text-align:center;color:var(--ink-2);padding:34px 20px;border:1px dashed var(--line);
  border-radius:var(--r);background:var(--surface);margin-bottom:12px;font-size:14.5px;
  line-height:1.6;animation:girisAlt .3s var(--ease) both}

/* ---------- maddeler ---------- */
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);
  transition:border-color .2s var(--ease)}
.item.emph{border-color:#EADCC4}
.item-h{display:flex;align-items:center;gap:4px;padding:10px 10px 0 12px}
.num{min-width:30px;height:28px;border-radius:7px;background:var(--accent-soft);
  color:var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 8px;
  transition:background .2s var(--ease),color .2s var(--ease)}
.item.emph .num{background:var(--mark-soft);color:var(--mark)}
.num.nonum{background:var(--line-2);color:var(--ink-3);font-size:11px;font-weight:500;
  letter-spacing:.04em;text-transform:uppercase}
.item-h .sp{flex:1}
.mini{background:transparent;border:0;border-radius:7px;width:34px;height:32px;
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;
  line-height:1;padding:0;color:var(--ink-2)}
.mini:hover{background:var(--line-2)}
.mini[disabled]{opacity:.25}
.mini.on{background:var(--mark-soft);color:var(--mark);font-weight:700}
.mini.del{color:var(--danger)}
.item textarea{width:100%;border:0;padding:8px 14px 12px;background:transparent;
  min-height:62px;font-family:"Times New Roman",Georgia,serif;font-size:16.5px;line-height:1.45}
.item.emph textarea{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.shots{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px}
.shot{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;
  background:var(--line-2);animation:girisAlt .28s var(--ease) both}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;
  border:0;background:rgba(20,26,36,.62);color:#fff;font-size:12px;line-height:1;
  backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.addshot{width:66px;height:84px;border:1px dashed #D3D9E3;color:var(--ink-2);
  background:var(--surface-2);border-radius:8px;font-size:11.5px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.addshot:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.addshot b{font-size:19px;font-weight:300;line-height:1}

.ekleSatir{display:flex;gap:8px;margin-bottom:12px}
.ekleAna{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);border:1px dashed #CBD3DF;color:var(--accent);
  border-radius:var(--r);padding:15px 10px;font-size:15px;font-weight:500}
.ekleAna:hover{border-color:var(--accent);background:var(--accent-soft)}
.ekleAna b{font-size:20px;font-weight:300;line-height:1}
.ekleHazir{background:var(--surface);border:1px dashed #CBD3DF;color:var(--ink-2);
  border-radius:var(--r);padding:15px 16px;font-size:14px;flex:none}
.ekleHazir:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

details.card > summary{padding:14px;font-size:13.5px;color:var(--ink-2);cursor:pointer;
  list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary span:last-child{color:var(--ink-3);font-size:12.5px}
details[open] > summary{border-bottom:1px solid var(--line-2)}
details.card > .card-b{animation:girisAlt .26s var(--ease) both}

/* ---------- alt bar ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(247,248,250,.93);backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:8px;max-width:700px;margin:0 auto}
.btn{border:1px solid var(--line);border-radius:9px;padding:13px 10px;font-size:15px;
  font-weight:500;background:var(--surface);color:var(--ink);flex:1;
  box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:#DCE1EA}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#35507A;border-color:#35507A}
.btn.wide{flex:1.35}
.btn.arti{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 10px}
.btn.arti span{font-size:24px;font-weight:300;line-height:1;margin-top:-2px}
.btn[disabled]{opacity:.4}
@media (max-width:400px){.btn{padding:13px 4px;font-size:14px}}

/* ---------- alt panel ---------- */
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;
  background:rgba(22,28,38,.34);animation:solgunGiris .2s var(--ease) both;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{background:var(--bg);width:100%;max-width:700px;margin:0 auto;max-height:84vh;
  overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow-2);
  padding:6px 14px calc(18px + env(safe-area-inset-bottom));
  animation:panelGiris .3s var(--ease) both}
.sheetwrap.kapan{animation:solgunCikis .18s var(--ease) both}
.sheetwrap.kapan .sheet{animation:panelCikis .18s var(--ease) both}
.sheet h3{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin:14px 4px 8px}
.sheet .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:14px;margin-bottom:8px;font-size:15px;line-height:1.4;box-shadow:var(--shadow)}
.sheet .opt:hover{background:var(--surface-2)}
.sheet .opt.danger{color:var(--danger)}
.sheet .opt .g{flex:1;min-width:0}
.sheet .opt small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:3px}
.sheet .opt .x{width:32px;height:32px;border:0;border-radius:7px;background:var(--line-2);
  color:var(--danger);flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px}
.grab{width:36px;height:4px;background:#D6DBE4;border-radius:2px;margin:10px auto 2px}

/* ---------- bildirim / perde ---------- */
.toast{position:fixed;left:50%;bottom:92px;z-index:60;background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:9px;font-size:14px;max-width:86%;text-align:center;
  box-shadow:var(--shadow-2);animation:bildirimGiris .26s var(--ease) both}
.veil{position:fixed;inset:0;background:rgba(247,248,250,.86);color:var(--ink-2);z-index:70;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  font-size:15px;padding:24px;text-align:center;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  animation:solgunGiris .2s var(--ease) both}
.veil .bar{width:150px;height:3px;background:var(--line);overflow:hidden;border-radius:2px}
.veil .bar i{display:block;height:100%;width:40%;background:var(--accent);
  border-radius:2px;animation:kayan 1.15s infinite var(--ease)}

/* ---------- animasyonlar ---------- */
@keyframes kayan{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
@keyframes solgunGiris{from{opacity:0}to{opacity:1}}
@keyframes solgunCikis{from{opacity:1}to{opacity:0}}
@keyframes panelGiris{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes panelCikis{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes girisAlt{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bildirimGiris{from{opacity:0;transform:translate(-50%,10px)}
  to{opacity:1;transform:translate(-50%,0)}}
@keyframes ekranIleri{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes ekranGeri{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes maddeCikis{to{opacity:0;transform:translateX(24px);max-height:0;
  margin-bottom:0;padding-top:0;padding-bottom:0}}
.ekran-ileri{animation:ekranIleri .3s var(--ease) both}
.ekran-geri{animation:ekranGeri .3s var(--ease) both}
.item.yeni{animation:girisAlt .34s var(--ease) both}
.item.gidiyor{max-height:600px;overflow:hidden;animation:maddeCikis .24s var(--ease) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
  .veil .bar i{width:100%}
}
</style>
</head>
<body>

<header class="top">
  <button class="iconbtn hide" id="btnBack">&#8592;</button>
  <h1 id="hTitle">Saha Raporları<small id="hSub"></small></h1>
  <button class="iconbtn" id="btnMenu">&#8942;</button>
</header>

<!-- ---------- RAPOR LİSTESİ ---------- -->
<main id="vListe">
  <div id="rapList"></div>
</main>

<!-- ---------- RAPOR DÜZENLEME ---------- -->
<main id="vDuzen" class="hide">
  <div class="card">
    <div class="card-h"><span>Rapor başlığı</span></div>
    <div class="card-b">
      <label class="f"><span>Mağaza / yer — başlığa aynen bu yazılır</span>
        <input id="fMagaza" placeholder="FLORENTIA AVM FLO MAĞAZASI" autocomplete="off"></label>
      <div class="row2">
        <label class="f"><span>Ziyaret no</span>
          <input id="fNo" inputmode="numeric" placeholder="3" autocomplete="off"></label>
        <label class="f"><span>Tarih</span><input id="fTarih" type="date"></label>
      </div>
      <div class="titleprev" id="titlePrev"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><span>Giriş cümlesi</span></div>
    <div class="card-b"><label class="f"><textarea id="fGiris" rows="2"
      placeholder="Yangın çıkış koridorundaki tesisatta aşağıdaki düzeltmeler yapılacak."></textarea></label></div>
  </div>

  <div id="items"></div>

  <div class="card">
    <div class="card-h"><span>Kapanış notu</span>
      <button class="mini" id="btnKapEmph" title="Kalın + altı çizili">A</button></div>
    <div class="card-b"><label class="f"><textarea id="fKapanis" rows="2"
      placeholder="Tüm eksik imalatların bitirilmiş hallerine ait resim ve videolar gönderilmelidir."></textarea></label></div>
  </div>

  <details class="card">
    <summary><span>Ayarlar — imza ve fotoğraf boyutu</span><span>düzenle</span></summary>
    <div class="card-b">
      <label class="f"><span>Rapordaki fotoğraf boyutu</span>
        <div class="seg" id="segFoto">
          <button type="button" data-v="kucuk">Küçük</button>
          <button type="button" data-v="orta">Orta</button>
          <button type="button" data-v="buyuk">Büyük</button>
        </div></label>
      <label class="f"><span>Ad Soyad</span><input id="fAd" autocomplete="off"></label>
      <label class="f"><span>Unvan 1</span><input id="fU1" autocomplete="off"></label>
      <label class="f"><span>Unvan 2</span><input id="fU2" autocomplete="off"></label>
    </div>
  </details>
</main>

<div class="bottom" id="barListe">
  <button class="btn primary" id="btnYeniRapor">+ Yeni rapor</button>
</div>

<div class="bottom hide" id="barDuzen">
  <button class="btn primary arti" id="btnArti" aria-label="Ekle ve oluştur">
    <span>+</span></button>
</div>

<input type="file" id="pickCam" accept="image/*" capture="environment" hidden>
<input type="file" id="pickLib" accept="image/*" multiple hidden>
<input type="file" id="pickJson" accept="application/json,.json" hidden>

const $  = s=>document.querySelector(s);
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const bugun = ()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());};
const trTarih = iso=>{ if(!iso) return ""; const[y,m,d]=iso.split("-"); return d+"."+m+"."+y; };
function baslikOf(r){
  const yer=(r.magaza||"").trim();
  const no=(r.no||"").trim();
  return (yer||"MAĞAZA ADI")+" ELEKTRİK KONTROL RAPORU"+(no?"-"+no:"")+" "+trTarih(r.tarih);
}
function animasyon(el,sinif){
  el.classList.remove(sinif); void el.offsetWidth; el.classList.add(sinif);
  setTimeout(()=>el.classList.remove(sinif),400);
}
let yeniMaddeId=null;
function toast(m,ms){const t=document.createElement("div");t.className="toast";t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2600);}
function veil(m){const v=document.createElement("div");v.className="veil";
  v.innerHTML='<div>'+m+'</div><div class="bar"><i></i></div>';document.body.appendChild(v);return v;}
function b64ToBytes(b64){const s=atob(b64),a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function blobToB64(b){return new Promise(res=>{const r=new FileReader();
  r.onload=()=>res(String(r.result).split(",")[1]);r.readAsDataURL(b);});}
function blobToDataUrl(b){return new Promise(res=>{const r=new FileReader();
  r.onload=()=>res(String(r.result));r.readAsDataURL(b);});}

/* ================= depo ================= */
let db=null;
function openDB(){return new Promise(res=>{
  const r=indexedDB.open("gence-rapor",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("kv");
  r.onsuccess=()=>{db=r.result;res(true)};
  r.onerror=()=>res(false);});}
function kvSet(k,v){return new Promise(res=>{ if(!db)return res(false);
  const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);
  t.oncomplete=()=>res(true);t.onerror=()=>res(false);});}
function kvGet(k){return new Promise(res=>{ if(!db)return res(null);
  const t=db.transaction("kv","readonly");const q=t.objectStore("kv").get(k);
  q.onsuccess=()=>res(q.result===undefined?null:q.result);q.onerror=()=>res(null);});}
function kvDel(k){return new Promise(res=>{ if(!db)return res(false);
  const t=db.transaction("kv","readwrite");t.objectStore("kv").delete(k);
  t.oncomplete=()=>res(true);t.onerror=()=>res(false);});}

const MAX_EDGE=1500, JPEG_Q=0.78;
async function kucult(file){
  let bmp;
  try{ bmp=await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){ bmp=await createImageBitmap(file); }
  let w=bmp.width,h=bmp.height;
  const s=Math.min(1,MAX_EDGE/Math.max(w,h));
  w=Math.round(w*s); h=Math.round(h*s);
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(bmp,0,0,w,h);
  bmp.close&&bmp.close();
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",JPEG_Q));
  return {id:uid(),blob,w,h};
}

async function yedekAl(){
  const v=veil("Yedek hazırlanıyor");
  try{
    const raporlar=[];
    for(const m of META){
      const r=await kvGet("rap:"+m.id); if(!r) continue;
      const kopya=JSON.parse(JSON.stringify({...r,items:[]}));
      kopya.items=[];
      for(const it of r.items){
        const fotolar=[];
        for(const p of it.photos) fotolar.push({id:p.id,w:p.w,h:p.h,b64:await blobToB64(p.blob)});
        kopya.items.push({id:it.id,text:it.text,emph:it.emph,photos:fotolar});
      }
      raporlar.push(kopya);
    }
    const data=JSON.stringify({v:1,tarih:new Date().toISOString(),ayar:AYAR,hazir:HAZIR,raporlar});
    const blob=new Blob([data],{type:"application/json"});
    indir(blob,"gence-saha-yedek-"+bugun()+".json");
    v.remove(); toast("Yedek indirildi. Drive'a veya bilgisayara at.",4000);
  }catch(e){ v.remove(); toast("Yedek alınamadı: "+e.message,5000); }
}

    if(!d.raporlar) throw new Error("dosya tanınmadı");

      const yeni={...r,id:uid(),guncel:Date.now()};
      yeni.items=r.items.map(it=>({id:uid(),text:it.text,emph:it.emph,
        photos:it.photos.map(p=>({id:uid(),w:p.w,h:p.h,
          blob:new Blob([b64ToBytes(p.b64)],{type:"image/jpeg"})}))}));
      await kvSet("rap:"+yeni.id,yeni);
      META.unshift({id:yeni.id,baslik:baslikOf(yeni),tarih:yeni.tarih,guncel:yeni.guncel,
        madde:yeni.items.length,foto:fotoSayisi(yeni)});
    }
    if(Array.isArray(d.hazir)) { d.hazir.forEach(t=>{ if(!HAZIR.includes(t)) HAZIR.push(t); });
      await kvSet("hazir",HAZIR); }
    await kvSet("meta",META);
    v.remove(); goListe(); toast(d.raporlar.length+" rapor geri yüklendi",3500);
  }catch(err){ v.remove(); toast("Yedek okunamadı: "+err.message,5000); }
};

/* ================= çıktı ================= */
function indir(blob,ad){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=ad; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),8000);
}
async function paylasVeyaIndir(blob,ad,tip){
  const file=new File([blob],ad,{type:tip});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:ad}); return "paylasildi"; }
    catch(e){ if(e&&e.name==="AbortError") return "iptal"; }
  }
  indir(blob,ad); return "indirildi";
}
function fotoAdi(r,n){
  const yer=(r.magaza||"foto").trim().replace(/[\\/:*?"<>|]/g,"-").slice(0,28) || "foto";
  return yer+"-"+trTarih(r.tarih).replace(/\./g,"-")+"-"+String(n).padStart(2,"0")+".jpg";
}
function tumFotolar(r){
  const liste=[]; let n=0;
  r.items.forEach(it=>it.photos.forEach(p=>liste.push({p:p,ad:fotoAdi(r,++n)})));
  return liste;
}
async function fotoKaydet(p,ad){
  const file=new File([p.blob],ad,{type:"image/jpeg"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:ad}); return "paylasildi"; }
    catch(e){ if(e&&e.name==="AbortError") return "iptal"; }
  }
  indir(p.blob,ad); return "indirildi";
}
async function tumFotoKaydet(){
  const liste=tumFotolar(R);
  if(!liste.length){ toast("Raporda fotoğraf yok"); return; }
  const files=liste.map(x=>new File([x.p.blob],x.ad,{type:"image/jpeg"}));
  if(navigator.canShare && navigator.canShare({files:files})){
    try{ await navigator.share({files:files,title:baslikOf(R)}); return; }
    catch(e){ if(e&&e.name==="AbortError") return; }
  }
  const v=veil(liste.length+" fotoğraf indiriliyor");
  for(const x of liste){ indir(x.p.blob,x.ad); await new Promise(r=>setTimeout(r,350)); }
  v.remove(); toast("İndirilenler klasörüne kaydedildi",3500);
}
function dosyaAdi(r,uzanti){ return baslikOf(r).replace(/[\\/:*?"<>|]/g,"-")+"."+uzanti; }

async function ciktiAl(id,tip,mevcut){
  const r=mevcut||await kvGet("rap:"+id);
  if(!r){ toast("Rapor okunamadı"); return; }
  if(!r.items.length){ toast("Raporda hiç madde yok"); return; }
  const v=veil(tip==="pdf"?"PDF hazırlanıyor":"Word dosyası hazırlanıyor");
  try{
    const blob = tip==="pdf" ? await pdfUret(r) : await docxUret(r);
    v.remove();
    const s=await paylasVeyaIndir(blob,dosyaAdi(r,tip),
      tip==="pdf"?"application/pdf":"application/vnd.openxmlformats-officedocument.wordprocessingml.document");
    if(s==="indirildi") toast("İndirilenler klasörüne kaydedildi",3500);
  }catch(e){ v.remove(); toast("Oluşturulamadı: "+e.message,5000); console.error(e); }
}

/* ---------- PDF ---------- */
const L=20,RR=190,W=170,TOP=36,BOT=272;
async function pdfUret(r){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4",compress:true});
  doc.addFileToVFS("sr.ttf",FONT.serR); doc.addFont("sr.ttf","ser","normal");
  doc.addFileToVFS("sb.ttf",FONT.serB); doc.addFont("sb.ttf","ser","bold");
  doc.addFileToVFS("nr.ttf",FONT.snsR); doc.addFont("nr.ttf","sns","normal");
  doc.addFileToVFS("nb.ttf",FONT.snsB); doc.addFont("nb.ttf","sns","bold");

  let y=TOP;
  const yeni=()=>{doc.addPage();y=TOP;};
  const yer=h=>{ if(y+h>BOT) yeni(); };

  function yaz(text,o){
    o=o||{};
    const size=o.size||12, font=o.font||"ser";
    doc.setFont(font,o.bold?"bold":"normal"); doc.setFontSize(size);
    doc.setTextColor(o.color||"#000000");
    const lh=size*0.352778*1.28;
    const lines=doc.splitTextToSize(text,W);
    lines.forEach((ln,i)=>{
      yer(lh);
      const son=i===lines.length-1, bas=y+lh*0.78;
      if(o.justify&&!son) doc.text(ln,L,bas,{maxWidth:W,align:"justify"});
      else doc.text(ln,L,bas);
      if(o.underline){
        const w=(o.justify&&!son)?W:doc.getTextWidth(ln);
        doc.setLineWidth(0.25); doc.setDrawColor(0);
        doc.line(L,bas+1.2,L+w,bas+1.2);
      }
      y+=lh;
    });
    y+=(o.after===undefined?3:o.after);
  }

  yaz(baslikOf(r),{bold:true,underline:true,after:6});
  if((r.giris||"").trim()) yaz(r.giris.trim(),{justify:true,after:4});

  const nums=numaralar(r);
  for(let i=0;i<r.items.length;i++){
    const it=r.items[i], t=(it.text||"").trim();
    if(!t && !it.photos.length) continue;
    if(t) yaz(nums[i]+"-"+t,{justify:true,bold:it.emph,underline:it.emph,
      after:it.photos.length?2:4});
    for(const p of it.photos){
      const ol=olcu();
      let w=ol.w,h=ol.w*p.h/p.w;
      if(h>ol.h){ h=ol.h; w=ol.h*p.w/p.h; }
      if(y+h>BOT) yeni();
      doc.addImage(await blobToDataUrl(p.blob),"JPEG",L+(W-w)/2,y,w,h);
      y+=h+4;
    }
  }
  if((r.kapanis||"").trim())
    yaz(r.kapanis.trim(),{justify:true,bold:r.kapanisEmph,underline:r.kapanisEmph,after:12});
  else y+=8;

  yer(30);
  yaz("Bilgilerinize Sunarım",{size:11,after:2});
  yaz(AYAR.imza.ad,{font:"sns",bold:true,size:11,color:"#1F4E79",after:0});
  yaz(AYAR.imza.u1,{font:"sns",size:11,color:"#2E74B5",after:0});
  yaz(AYAR.imza.u2,{font:"sns",size:11,color:"#2E74B5",after:0});

  const G="data:image/jpeg;base64,"+LOGO_GENCE_B64, J="data:image/jpeg;base64,"+LOGO_JAS_B64;
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.addImage(G,"JPEG",L,12,45,13.5);
    doc.addImage(J,"JPEG",RR-26,11,26,15.2);
    doc.setDrawColor(0); doc.setLineWidth(0.2);
    doc.setLineDashPattern([0.7,0.7],0); doc.line(L,30,RR,30);
    doc.setLineDashPattern([],0);
    doc.setLineWidth(0.5); doc.line(L,277,RR,277);
    doc.setFont("sns","normal"); doc.setFontSize(8); doc.setTextColor("#808080");
    doc.text(trTarih(r.tarih),L,281.5);
    doc.setFont("sns","bold"); doc.setTextColor("#000000");
    doc.text(String(i),RR,281.5,{align:"right"});
  }
  return doc.output("blob");
}

/* ---------- Word ---------- */
const MM=()=>docx.convertMillimetersToTwip;
async function docxUret(r){
  const D=docx, TNR="Times New Roman", mm=D.convertMillimetersToTwip;
  const P=(text,o)=>{ o=o||{};
    return new D.Paragraph({
      alignment:o.align||D.AlignmentType.JUSTIFIED,
      spacing:{after:o.after===undefined?160:o.after,line:276},
      keepNext:!!o.keepNext,
      children:[new D.TextRun({text:text,font:TNR,size:o.size||24,bold:!!o.bold,
        underline:o.underline?{type:D.UnderlineType.SINGLE}:undefined,color:o.color})]
    });};
  const kids=[];
  kids.push(P(baslikOf(r),{bold:true,underline:true,align:D.AlignmentType.LEFT,after:320}));
  if((r.giris||"").trim()) kids.push(P(r.giris.trim(),{after:240}));

  const nums=numaralar(r);
  for(let i=0;i<r.items.length;i++){
    const it=r.items[i], t=(it.text||"").trim();
    if(!t && !it.photos.length) continue;
    if(t) kids.push(P(nums[i]+"-"+t,{bold:it.emph,underline:it.emph,
      keepNext:it.photos.length>0,after:it.photos.length?120:200}));
    for(const p of it.photos){
      const ol=olcu(), PX=3.7795;   // mm -> 96dpi piksel
      const s=Math.min(ol.w*PX/p.w,ol.h*PX/p.h,1);
      kids.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:200},
        children:[new D.ImageRun({type:"jpg",data:new Uint8Array(await p.blob.arrayBuffer()),
          transformation:{width:Math.round(p.w*s),height:Math.round(p.h*s)}})]}));
    }
  }
  if((r.kapanis||"").trim())
    kids.push(P(r.kapanis.trim(),{bold:r.kapanisEmph,underline:r.kapanisEmph,after:600}));
  else kids.push(P("",{after:400}));

  kids.push(new D.Paragraph({spacing:{after:120},
    children:[new D.TextRun({text:"Bilgilerinize Sunarım",font:TNR,size:22})]}));
  const im=(t,b,c)=>new D.Paragraph({spacing:{after:0},
    children:[new D.TextRun({text:t,font:"Calibri",size:22,bold:b,color:c})]});
  kids.push(im(AYAR.imza.ad,true,"1F4E79"));
  kids.push(im(AYAR.imza.u1,false,"2E74B5"));
  kids.push(im(AYAR.imza.u2,false,"2E74B5"));

  const header=new D.Header({children:[
    new D.Paragraph({spacing:{after:0},
      tabStops:[{type:D.TabStopType.RIGHT,position:mm(170)}],
      children:[
        new D.ImageRun({type:"jpg",data:b64ToBytes(LOGO_GENCE_B64),
          transformation:{width:170,height:51}}),
        new D.TextRun({children:[new D.Tab()]}),
        new D.ImageRun({type:"jpg",data:b64ToBytes(LOGO_JAS_B64),
          transformation:{width:100,height:59}})]}),
    new D.Paragraph({spacing:{before:40,after:0},
      border:{bottom:{style:D.BorderStyle.DASH_SMALL_GAP,size:4,space:1,color:"000000"}},
      children:[new D.TextRun({text:"",size:2})]})
  ]});
  const footer=new D.Footer({children:[
    new D.Paragraph({spacing:{after:0},
      border:{top:{style:D.BorderStyle.SINGLE,size:12,space:2,color:"000000"}},
      tabStops:[{type:D.TabStopType.RIGHT,position:mm(170)}],
      children:[
        new D.TextRun({text:trTarih(r.tarih),font:"Calibri",size:18,color:"808080"}),
        new D.TextRun({children:[new D.Tab()]}),
        new D.TextRun({children:[D.PageNumber.CURRENT],font:"Calibri",size:18,bold:true})]})
  ]});

  const doc=new D.Document({creator:AYAR.imza.ad,title:baslikOf(r),
    sections:[{properties:{page:{size:{width:mm(210),height:mm(297)},
      margin:{top:mm(28),bottom:mm(20),left:mm(20),right:mm(20),header:mm(8),footer:mm(8)}}},
      headers:{default:header},footers:{default:footer},children:kids}]});
  return await D.Packer.toBlob(doc);
}
